<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destiny Smith</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://kit.fontawesome.com/f9647aa6c1.js" crossorigin="anonymous"></script> 
</head>

<body>
  <section id="aboutme">
    <nav>
      <div class="personal__logo">Destiny Smith</div>
      <ul class="nav__link--list">
        <li>
          <a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
        ">Languages</a>
       </li>
        <li>
        <a href="" class="
        nav__link--anchor
        link__hover-effect
        link__hover-effect--black
      ">Projects</a>
        </li>
        <li>
        <a href="" class="
        nav__link--anchor
        nav__link--anchor-primary
      ">Contacts</a>
       </li>
      </ul>
    </nav>
    <div class="flex flex-1">
      <div class="about-me__info row">
        <div class="about-me__info--container">
          <figure class="about-me__picture--mask">
            <img src="./assets/me.jpg" class="about-me__picture" alt="Picture of Me!" />
          </figure>
          <h1 class="about-me__info--title">
            Hey! I'm <span class="text--purple">Destiny Smith</span> 👋🏽
          </h1>
          <p class="about-me__info--para">
            I'm an aspiring <strong class="text--purple">frontend software engineer</strong> with a passion for creating beautiful and functional web applications. I enjoy learning new technologies and improving my skills to become a better developer.
          </p>
          <div class="about-me__links">
            <a href="" class="about-me__link"><i class="fa-brands fa-facebook"></i></a>
            <a href="" class="about-me__link"><i class="fa-brands fa-instagram"></i></a>
            <a href="" class="about-me__link"><i class="fa-brands fa-tiktok"></i></a>
            <a href="" class="about-me__link"><i class="fa-brands fa-github"></i>
            </a>
          </div>
        </div>
        <figure class="about-me__img--container">
          <img src="./assets/undraw_websites.svg" class="about-me__img" alt="Illustration">
        </figure>
      </div>
    </div> 
  </section>
</body>

</html>
